<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>つながっていません</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f5ff; --fg: #1c1733; --accent: #5b3cf0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #110e21; --fg: #ece9ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { margin: 0 0 20px; line-height: 1.7; opacity: .8; }
  button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 28px; }
</style>
</head>
<body>
<main>
  <img src="/static/icons/icon-192.png" alt="">
  <h1>インターネットにつながっていません</h1>
  <p>電波のよい場所で、もう一度開いてください。</p>
  <button onclick="location.reload()">もう一度読み込む</button>
</main>
</body>
</html>
