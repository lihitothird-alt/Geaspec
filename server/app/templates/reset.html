{% extends "base.html" %}
{% block title %}新しいパスワード | {{ settings.service_name }}{% endblock %}
{% block content %}
<section class="wrap auth">
  <div class="auth-card">
    <h1>新しいパスワード</h1>
    {% if invalid %}
    <div class="flash error" role="alert">このリンクは期限が切れたか、すでに使われています。</div>
    <p class="auth-foot muted"><a href="/forgot">もう一度メールを送る</a></p>
    {% else %}
    <p class="intro">新しいパスワードを決めてください。決めると、そのままログインします。</p>
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="form">
      <input type="hidden" name="t" value="{{ token }}">
      <label><span>新しいパスワード <span class="opt">（8文字以上）</span></span><input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
      <button class="btn block lg">このパスワードにする</button>
    </form>
    {% endif %}
  </div>
</section>
{% endblock %}
