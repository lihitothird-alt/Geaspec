{# 先行登録のフォーム。back は送ったあとに戻るページ (/test か /vrchat) #}
  <form class="form test-form" method="post" action="/test">
    <input type="hidden" name="back" value="{{ back|default('/test') }}">
    <fieldset><legend>使う機器</legend>
      {% for k, v in devices.items() %}<label class="check"><input type="radio" name="device" value="{{ k }}" required> {{ v }}</label>{% endfor %}
    </fieldset>
    <label>住んでいる都道府県<select name="area" required><option value="">選んでください</option>{% for k in area_choices %}<option value="{{ k }}">{{ areas[k] }}</option>{% endfor %}</select></label>
    <fieldset><legend>ふだん VRChat にいる時間<span class="muted small">いくつでも</span></legend>
      {% for k in time_choices %}<label class="check"><input type="checkbox" name="times" value="{{ k }}"> {{ times[k] }}</label>{% endfor %}
    </fieldset>
    <label>メールアドレス<input type="email" name="email" required autocomplete="email" inputmode="email" value="{{ user.email if user else '' }}"></label>
    <label class="check"><input type="checkbox" name="adult" value="1" required> 18歳以上です</label>
    <label class="check"><input type="checkbox" name="agree" value="1" required> <span><a href="/legal/terms" target="_blank">利用規約</a>と<a href="/legal/privacy" target="_blank">プライバシーポリシー</a>に同意します</span></label>
    <button class="btn">先行登録する</button>
  </form>
  <p class="muted small">いただいた連絡先は、Geaspec VR のご案内にだけ使います。</p>
